server:
  port: 8081
  servlet:
    context-path: /api

spring:
  application:
    name: dealer-management-system

  datasource:
    url: jdbc:mysql://localhost:3306/dms_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: Qasim@786
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: DMS-HikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

# JWT Configuration
jwt:
  secret: dms-hyundai-autoever-secret-key-2024-very-long-secure-key-for-production
  expiration: 86400000       # 24 hours in ms
  refresh-expiration: 604800000  # 7 days in ms

# App Configuration
app:
  max-login-attempts: 5
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173

# Logging
logging:
  level:
    root: INFO
    com.hyundai.dms: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/dms-application.log

# SpringDoc OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: Dealer Management System API
    version: v1
    description: Hyundai AutoEver DMS REST API

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
